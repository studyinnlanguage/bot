<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weexionic — App khul raha hai…</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #07090d; color: #f2f4f7;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 24px;
  }
  .card { max-width: 420px; width: 100%; text-align: center;
    background: #0d1017; border: 1px solid #23262e; border-radius: 18px; padding: 34px 26px; }
  .logo { width: 74px; height: 74px; margin: 0 auto 16px; border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #f0b90b33, transparent 70%), #0b0d12;
    border: 2px solid #f0b90b; display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; color: #f0b90b; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { font-size: 13.5px; color: #8a93a5; line-height: 1.65; margin-bottom: 18px; }
  .btn { display: inline-block; padding: 13px 26px; border-radius: 12px; border: 0;
    background: linear-gradient(135deg, #f0b90b, #d9a406); color: #10120a;
    font-size: 14px; font-weight: 700; letter-spacing: .04em; cursor: pointer; }
  .hint { font-size: 12px; color: #5b6472; margin-top: 16px; }
  .ok { color: #0ecb81; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">W</div>
    <h1 class="ok" id="st">Google login done!</h1>
    <p>App khul raha hai… Agar app na khule to neeche button dabao, phir app ke andar login complete ho jayega.</p>
    <button class="btn" onclick="openApp()">APP KHOLEIN</button>
    <p class="hint">Browser mein hi ruk gaya? Button dabao — "Weexionic" choose karke Always bhi select kar sakte ho.</p>
  </div>
  <script>
    var token = new URLSearchParams(location.search).get("token") || "";
    function openApp() {
      if (!token) return;
      location.replace("weexionic://oauth?token=" + encodeURIComponent(token));
    }
    if (token) setTimeout(openApp, 600);
  </script>
</body>
</html>
