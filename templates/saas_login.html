<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeBot SaaS - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0b0e11 0%, #1a1d24 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            color: #eaecef; padding: 20px;
        }
        .login-card {
            background: #1e2126; border: 1px solid #2a2e36; border-radius: 16px;
            padding: 40px; width: 100%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .logo {
            width: 72px; height: 72px; background: linear-gradient(135deg, #f0b90b 0%, #f8d12f 100%);
            color: #0b0e11; border-radius: 18px; display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 32px; margin: 0 auto 20px; box-shadow: 0 8px 24px rgba(240,185,11,0.3);
        }
        .title { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .subtitle { text-align: center; font-size: 13px; color: #848e9c; margin-bottom: 28px; line-height: 1.5; }
        .tabs { display: flex; background: #0b0e11; border-radius: 10px; padding: 4px; margin-bottom: 24px; }
        .tab {
            flex: 1; padding: 10px; text-align: center; cursor: pointer; border-radius: 8px;
            font-size: 13px; font-weight: 600; color: #848e9c; border: none; background: none; transition: all 0.2s;
        }
        .tab.active { background: #f0b90b; color: #0b0e11; }
        .form-group { margin-bottom: 16px; }
        .label { display: block; font-size: 12px; color: #848e9c; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input {
            width: 100%; padding: 14px 16px; background: #0b0e11; border: 1px solid #2a2e36;
            color: #eaecef; border-radius: 10px; font-size: 14px; transition: border 0.2s;
        }
        .input:focus { outline: none; border-color: #f0b90b; }
        .btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #f0b90b 0%, #f8d12f 100%);
            color: #0b0e11; border: none; border-radius: 10px; font-size: 14px; font-weight: 700;
            cursor: pointer; transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error {
            background: rgba(246,70,93,0.1); border: 1px solid rgba(246,70,93,0.3);
            color: #f6465d; padding: 12px 14px; border-radius: 8px; font-size: 13px;
            margin-bottom: 16px; display: none;
        }
        .error.show { display: block; }
        .info {
            background: rgba(240,185,11,0.08); border: 1px dashed rgba(240,185,11,0.3);
            color: #f0b90b; padding: 12px; border-radius: 8px; font-size: 12px; line-height: 1.6; margin-top: 20px;
        }
        .divider { display: flex; align-items: center; margin: 20px 0; color: #848e9c; font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #2a2e36; }
        .divider span { padding: 0 12px; }
        .google-btn {
            width: 100%; padding: 12px; background: #ffffff; color: #333;
            border: 1px solid #ddd; border-radius: 10px; font-size: 14px; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: background 0.2s;
        }
        .google-btn:hover { background: #f5f5f5; }
        .google-btn svg { width: 18px; height: 18px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">T</div>
        <h1 class="title">TradeBot SaaS</h1>
        <p class="subtitle">EMA 8, 13, 21, 55 Trading Bot Platform<br>24/7 Cloud Trading</p>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('login', event)">Login</button>
            <button class="tab" onclick="switchTab('signup', event)">Sign Up</button>
        </div>

        <div id="errorMsg" class="error"></div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label class="label">Email</label>
                <input type="email" id="loginEmail" class="input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label class="label">Password</label>
                <input type="password" id="loginPassword" class="input" placeholder=".........." required>
            </div>
            <button type="submit" id="loginBtn" class="btn">Login</button>
        </form>

        <form id="signupForm" onsubmit="return handleSignup(event)" style="display:none;">
            <div class="form-group">
                <label class="label">Name (optional)</label>
                <input type="text" id="signupName" class="input" placeholder="Your name">
            </div>
            <div class="form-group">
                <label class="label">Email</label>
                <input type="email" id="signupEmail" class="input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label class="label">Password (min 6 chars)</label>
                <input type="password" id="signupPassword" class="input" placeholder=".........." required minlength="6">
            </div>
            <div class="form-group">
                <label class="label">Referral Code (optional)</label>
                <input type="text" id="signupReferral" class="input" placeholder="ABC12345" style="text-transform:uppercase;" value="{{ ref_code or '' }}">
            </div>
            <button type="submit" id="signupBtn" class="btn">Create Account</button>
        </form>

        <div class="divider"><span>OR</span></div>

        <a href="/auth/google" class="google-btn" style="text-decoration:none;">
            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 4.09 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Continue with Google
        </a>

        <div class="info">
            <strong>Get started:</strong> Create an account, select a package, make the payment,<br>
            and start trading within minutes!<br><br>
            Strategy: EMA 8, 13, 21, 55 crossover<br>
            Strict 1:3 Risk-Reward (SL=2%, TP=6%)
        </div>
    </div>

    <script>
        function switchTab(tab, event) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
            document.getElementById('errorMsg').classList.remove('show');
        }
        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg; el.classList.add('show');
        }
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true; btn.textContent = 'Logging in...';
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);
            try {
                const r = await fetch('/api/auth/login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value,
                    }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                const data = await r.json();
                if (data.success) { window.location.href = '/'; }
                else { showError(data.error || 'Login failed'); }
            } catch(err) {
                clearTimeout(timeoutId);
                showError(err.name === 'AbortError' ? 'Server timeout. Try again.' : 'Network error');
            }
            btn.disabled = false; btn.textContent = 'Login';
            return false;
        }
        async function handleSignup(e) {
            e.preventDefault();
            const btn = document.getElementById('signupBtn');
            btn.disabled = true; btn.textContent = 'Creating account...';
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);
            try {
                const r = await fetch('/api/auth/signup', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        name: document.getElementById('signupName').value,
                        email: document.getElementById('signupEmail').value,
                        password: document.getElementById('signupPassword').value,
                        referral_code: document.getElementById('signupReferral').value,
                    }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                const data = await r.json();
                if (data.success) { window.location.href = '/'; }
                else { showError(data.error || 'Signup failed'); }
            } catch(err) {
                clearTimeout(timeoutId);
                showError(err.name === 'AbortError' ? 'Server timeout. Try again.' : 'Network error');
            }
            btn.disabled = false; btn.textContent = 'Create Account';
            return false;
        }
    </script>
</body>
</html>
