name: weexionic_app
description: "WEEXIONIC Futures Trading Bot - Mobile Client (Flutter)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

  # Material icons
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.1

  # Networking
  http: ^1.2.0
  socket_io_client: ^2.0.3+1

  # Charts
  fl_chart: ^0.68.0
  candlesticks: ^2.2.0

  # Storage
  shared_preferences: ^2.2.2

  # Utils
  intl: ^0.19.0
  google_fonts: ^6.2.1

  # UI
  flutter_svg: ^2.0.9
  animated_bottom_navigation_bar: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
