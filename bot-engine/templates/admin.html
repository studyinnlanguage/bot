<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - License Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0b0e11 0%, #1a1d24 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Inter', sans-serif;
            color: #eaecef;
        }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2a2e36;
        }
        .admin-title {
            font-size: 24px;
            font-weight: 700;
            color: #f0b90b;
        }
        .admin-card {
            background: #1e2126;
            border: 1px solid #2a2e36;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .admin-card h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #848e9c;
            margin: 0 0 16px;
        }
        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .form-group {
            flex: 1;
            min-width: 150px;
        }
        .form-label {
            display: block;
            font-size: 11px;
            color: #848e9c;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 8px 10px;
            background: #0b0e11;
            border: 1px solid #2a2e36;
            color: #eaecef;
            border-radius: 6px;
            font-size: 13px;
            box-sizing: border-box;
        }
        .btn {
            padding: 8px 16px;
            background: #f0b90b;
            color: #0b0e11;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover { background: #f8d12f; }
        .btn-sm { padding: 4px 10px; font-size: 11px; }
        .btn-danger { background: #f6465d; color: #fff; }
        .btn-success { background: #0ecb81; color: #0b0e11; }
        .btn-warn { background: transparent; color: #f0b90b; border: 1px solid #f0b90b; }
        .btn-secondary { background: #2a2e36; color: #eaecef; }
        .keys-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .keys-table th, .keys-table td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #2a2e36;
        }
        .keys-table th {
            color: #848e9c;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #181a20;
        }
        .keys-table tr:hover { background: #181a20; }
        .key-cell {
            font-family: 'JetBrains Mono', monospace;
            color: #f0b90b;
            cursor: pointer;
        }
        .key-cell:hover { text-decoration: underline; }
        .badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-active { background: rgba(14, 203, 129, 0.15); color: #0ecb81; }
        .badge-revoked { background: rgba(246, 70, 93, 0.15); color: #f6465d; }
        .badge-expired { background: rgba(132, 142, 156, 0.15); color: #848e9c; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #181a20;
            padding: 16px;
            border-radius: 8px;
            border-left: 3px solid #f0b90b;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #f0b90b;
            font-family: 'JetBrains Mono', monospace;
        }
        .stat-label {
            font-size: 11px;
            color: #848e9c;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .login-overlay.hidden { display: none; }
        .login-box {
            background: #1e2126;
            padding: 24px;
            border-radius: 10px;
            width: 320px;
        }
        .msg {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 12px;
            display: none;
        }
        .msg.show { display: block; }
        .msg-success { background: rgba(14, 203, 129, 0.1); color: #0ecb81; }
        .msg-error { background: rgba(246, 70, 93, 0.1); color: #f6465d; }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .admin-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .admin-title { font-size: 18px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .admin-table { min-width: 600px; }
            .form-row { flex-direction: column; }
            .form-group { width: 100%; min-width: 0; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>

<link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style id="concept-sync">
/* ==================================================================
   WEEXIONIC CONCEPT SYNC v1 — approved UI/UX concept design language
   Applied as append-only override layer. No HTML structure changes.
   Refines: tokens, display typography, gradient CTAs, card surfaces,
   glow highlights, inputs, scrollbars. All original classes preserved.
   ================================================================== */

/* ---------- 1. Design tokens (values refined, names untouched) ---------- */
:root {
    --bg-base: #07090d;
    --bg-surface: #0b0e13;
    --bg-card: #10141b;
    --bg-card-alt: #141924;
    --border-subtle: rgba(255, 255, 255, 0.07);
    --border-strong: rgba(255, 255, 255, 0.12);
    --text-primary: #eef1f6;
    --text-secondary: #9aa4b2;
    --text-muted: #6b7686;
    --violet: #9d7bff;
    --grad-gold: linear-gradient(135deg, #f0b90b 0%, #fcd535 100%);
    --grad-green: linear-gradient(135deg, #0ecb81 0%, #2ed390 100%);
    --grad-red: linear-gradient(135deg, #f6465d 0%, #ff6b81 100%);
    --font-display: 'Space Grotesk', 'Inter', sans-serif;
}

/* ---------- 2. Display typography — Space Grotesk headlines ---------- */
h1, h2, h3, .hero-title, .doc-title, .card-title, .admin-title,
.section-title, .plan-name, .login-title, .brand-text h1 {
    font-family: var(--font-display) !important;
    letter-spacing: -0.4px;
}

h1 span, h2 span, h2 em, .doc-title em, .section-title em {
    letter-spacing: inherit;
}

/* Gold glow gradient text — signature concept look */
.hero-title .highlight,
.glow-text {
    background: linear-gradient(100deg, #fcd535 8%, #f0b90b 45%, #ffe98a 90%);
    -webkit-background-clip: text !important;
    background-clip: text !important;
    -webkit-text-fill-color: transparent;
    color: transparent;
}

.brand-text h1 span { color: var(--gold); }

/* ---------- 3. Buttons — gradient CTAs with premium depth ---------- */
.btn-gold, .btn-buy-plan, .btn-select.btn-gold {
    background: var(--grad-gold) !important;
    color: #151b2e !important;
    border-radius: 12px !important;
    box-shadow: 0 6px 24px rgba(240, 185, 11, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.45) !important;
    transition: transform 0.18s ease, box-shadow 0.25s ease, filter 0.2s ease !important;
}
.btn-gold:hover, .btn-buy-plan:hover {
    transform: translateY(-2px);
    filter: brightness(1.06);
    box-shadow: 0 10px 34px rgba(240, 185, 11, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.45) !important;
}
.btn-gold:active, .btn-buy-plan:active { transform: translateY(1px) scale(0.98); }

.btn-ghost, .btn-outline {
    background: rgba(255, 255, 255, 0.04) !important;
    color: var(--text-primary) !important;
    border: 1px solid var(--border-strong) !important;
    border-radius: 12px !important;
    transition: all 0.2s ease !important;
}
.btn-ghost:hover, .btn-outline:hover {
    background: rgba(255, 255, 255, 0.08) !important;
    border-color: rgba(240, 185, 11, 0.4) !important;
    transform: translateY(-1px);
}

/* ---------- 4. Cards — gradient surfaces + signature gold hairline ---------- */
.feature-card, .pricing-card, .login-card, .order-card, .card,
.content-card, .admin-card, .terminal-preview-card, .license-key {
    position: relative;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.032), rgba(255, 255, 255, 0.012)), var(--bg-card) !important;
    border: 1px solid var(--border-subtle) !important;
}
.feature-card::before, .pricing-card::before, .order-card::before {
    content: "";
    position: absolute;
    top: 0; left: 28px; right: 28px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(240, 185, 11, 0.5), transparent);
    pointer-events: none;
}
.feature-card:hover, .pricing-card:hover, .order-card:hover {
    border-color: rgba(240, 185, 11, 0.3) !important;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), 0 0 40px rgba(240, 185, 11, 0.06);
}

/* ---------- 5. Inputs — focus rings in brand gold ---------- */
.input, .form-input, .login-input, input[type="text"], input[type="email"],
input[type="password"], input[type="number"], select, textarea {
    background: var(--bg-card) !important;
    border: 1px solid var(--border-strong) !important;
    border-radius: 12px !important;
    transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
}
.input:focus, .form-input:focus, .login-input:focus,
input:focus, select:focus, textarea:focus {
    outline: none !important;
    border-color: rgba(240, 185, 11, 0.55) !important;
    box-shadow: 0 0 0 3px rgba(240, 185, 11, 0.12) !important;
}
.label, .form-label, .login-label {
    letter-spacing: 0.9px;
    text-transform: uppercase;
    font-weight: 600 !important;
}

/* ---------- 6. Page atmosphere — deep space bg + aurora glows ---------- */
body {
    background:
        radial-gradient(900px 480px at 50% -140px, rgba(240, 185, 11, 0.07), transparent 62%),
        radial-gradient(700px 420px at 88% 12%, rgba(75, 159, 255, 0.04), transparent 60%),
        radial-gradient(600px 400px at 8% 28%, rgba(157, 123, 255, 0.035), transparent 60%),
        var(--bg-base) !important;
    color: var(--text-primary);
}

/* ---------- 7. Chips, pills, badges — refined ---------- */
.badge-live, .hero-tag, .exchange-chip, .ema-pill {
    border-radius: 999px !important;
}
.pulse-dot {
    box-shadow: 0 0 0 0 rgba(14, 203, 129, 0.6);
    animation: cs-pulse 2s infinite;
}
@keyframes cs-pulse {
    0% { box-shadow: 0 0 0 0 rgba(14, 203, 129, 0.55); }
    70% { box-shadow: 0 0 0 9px rgba(14, 203, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(14, 203, 129, 0); }
}

/* ---------- 8. Scrollbars + selection — brand consistency ---------- */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: var(--bg-base); }
::-webkit-scrollbar-thumb {
    background: #262d3a; border-radius: 99px;
    border: 2px solid var(--bg-base);
}
::-webkit-scrollbar-thumb:hover { background: #3a4352; }
::selection { background: rgba(240, 185, 11, 0.28); color: #fff; }

/* ---------- 9. Tables — crisp headers ---------- */
table { border-collapse: collapse; }
th {
    font-family: 'Inter', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 700 !important;
}
tr:hover td { background: rgba(255, 255, 255, 0.018); }


/* --- admin: crisp command center --- */
.admin-container, .admin-card, .card { border-radius: 18px !important; }
.admin-header { border-bottom: 1px solid var(--border-subtle) !important; }
.admin-title { letter-spacing: -0.5px; }
table { border-radius: 12px; overflow: hidden; }
th { background: var(--bg-card-alt) !important; color: var(--text-secondary) !important;
    font-size: 11px; padding: 12px 14px !important; border-bottom: 1px solid var(--border-strong) !important; }
td { border-bottom: 1px solid var(--border-subtle) !important; }
/* badges — soft tint style */
[class*="badge-"], .badge { border-radius: 999px !important; font-weight: 700 !important;
    letter-spacing: .4px; border: 1px solid transparent !important; }
.badge-active, .badge-running, .badge-used, .badge-verified {
    background: rgba(14,203,129,.1) !important; color: #2ed390 !important; border-color: rgba(14,203,129,.35) !important; }
.badge-pending, .badge-submitted { background: rgba(240,185,11,.1) !important;
    color: var(--gold) !important; border-color: rgba(240,185,11,.35) !important; }
.badge-rejected, .badge-banned, .badge-revoked, .badge-expired {
    background: rgba(246,70,93,.1) !important; color: #ff6b81 !important; border-color: rgba(246,70,93,.35) !important; }
.badge-inactive, .badge-unused { background: rgba(255,255,255,.05) !important;
    color: var(--text-secondary) !important; border-color: var(--border-strong) !important; }
/* admin buttons */
.btn, .btn-sm, .btn-verify, .btn-create, .btn-delete, .btn-reject, .btn-revoke,
.btn-success, .btn-danger, .btn-warn, .btn-secondary {
    border-radius: 11px !important; font-weight: 700 !important; transition: all .18s ease !important; }
.btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
.btn:active { transform: translateY(1px) scale(.98); }
.btn-success, .btn-verify, .btn-create { background: var(--grad-green) !important; color: #04150d !important;
    box-shadow: 0 4px 16px rgba(14,203,129,.25) !important; }
.btn-danger, .btn-delete, .btn-reject, .btn-revoke { background: var(--grad-red) !important; color: #fff !important;
    box-shadow: 0 4px 16px rgba(246,70,93,.25) !important; }
.btn-warn { background: var(--grad-gold) !important; color: #151b2e !important;
    box-shadow: 0 4px 16px rgba(240,185,11,.25) !important; }
.btn-secondary { background: rgba(255,255,255,.05) !important; border: 1px solid var(--border-strong) !important; }

</style>
</head>
<body>
    <!-- Admin Login Overlay -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2 style="text-align:center;margin-bottom:16px;color:#f0b90b">🔐 Admin Login</h2>
            <input type="password" id="adminPass" class="form-input" placeholder="Admin password" style="margin-bottom:12px">
            <button onclick="adminLogin()" class="btn" style="width:100%">Login</button>
            <p style="text-align:center;margin-top:12px;font-size:11px;color:#848e9c">
                Enter your admin password
            </p>
        </div>
    </div>

    <div class="admin-container" id="adminContent" style="display:none">
        <div class="admin-header">
            <h1 class="admin-title">🔐 License Management Admin Panel</h1>
            <div>
                <a href="/" class="btn btn-secondary btn-sm">Bot Dashboard</a>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">Total Licenses</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statActive">0</div>
                <div class="stat-label">Active</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statRevoked">0</div>
                <div class="stat-label">Revoked</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statExpired">0</div>
                <div class="stat-label">Expired</div>
            </div>
        </div>

        <div id="adminMsg" class="msg"></div>

        <!-- Create New License -->
        <div class="admin-card">
            <h2>➕ Create New License Key</h2>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Plan (Days)</label>
                    <select id="planDays" class="form-select">
                        <option value="1">1 Day (Trial)</option>
                        <option value="7">7 Days</option>
                        <option value="30" selected>30 Days (1 Month)</option>
                        <option value="90">90 Days (3 Months)</option>
                        <option value="180">180 Days (6 Months)</option>
                        <option value="365">365 Days (1 Year)</option>
                        <option value="9999">Lifetime</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Note (optional)</label>
                    <input type="text" id="noteField" class="form-input" placeholder="e.g. Customer name, phone">
                </div>
                <div class="form-group" style="display:flex;align-items:flex-end">
                    <button onclick="createKey()" class="btn" style="width:100%">Create Key</button>
                </div>
            </div>
        </div>

        <!-- Extend License -->
        <div class="admin-card">
            <h2>⏰ Extend License</h2>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">License Key</label>
                    <input type="text" id="extendKey" class="form-input" placeholder="TRDBOT-XXXX-XXXX-XXXX-XXXX" style="text-transform:uppercase">
                </div>
                <div class="form-group">
                    <label class="form-label">Extra Days</label>
                    <input type="number" id="extendDays" class="form-input" value="30" min="1">
                </div>
                <div class="form-group" style="display:flex;align-items:flex-end">
                    <button onclick="extendKey()" class="btn btn-success" style="width:100%">Extend</button>
                </div>
            </div>
        </div>

        <!-- All Licenses Table -->
        <div class="admin-card">
            <h2>📋 All License Keys</h2>
            <div style="overflow-x:auto">
                <table class="keys-table" id="keysTable">
                    <thead>
                        <tr>
                            <th>Key</th>
                            <th>Status</th>
                            <th>Plan</th>
                            <th>Created</th>
                            <th>Expires</th>
                            <th>Activated</th>
                            <th>HW ID</th>
                            <th>Note</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="keysBody">
                        <tr><td colspan="9" style="text-align:center;color:#848e9c;padding:20px">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Check if already logged in
        fetch('/api/admin/keys').then(r => r.json()).then(data => {
            if (data.success) {
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('adminContent').style.display = 'block';
                loadKeys();
            }
        });

        function adminLogin() {
            const pass = document.getElementById('adminPass').value;
            fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('loginOverlay').classList.add('hidden');
                    document.getElementById('adminContent').style.display = 'block';
                    loadKeys();
                } else {
                    alert(data.error);
                }
            });
        }

        document.getElementById('adminPass').addEventListener('keypress', e => {
            if (e.key === 'Enter') adminLogin();
        });

        function showMsg(text, type) {
            const el = document.getElementById('adminMsg');
            el.textContent = text;
            el.className = 'msg show msg-' + type;
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        function loadKeys() {
            fetch('/api/admin/keys')
                .then(r => r.json())
                .then(data => {
                    if (!data.success) return;
                    const keys = data.licenses;
                    let active = 0, revoked = 0, expired = 0;
                    const now = new Date();
                    keys.forEach(k => {
                        if (k.revoked) revoked++;
                        else if (new Date(k.expires_at) < now) expired++;
                        else if (k.active) active++;
                    });
                    document.getElementById('statTotal').textContent = keys.length;
                    document.getElementById('statActive').textContent = active;
                    document.getElementById('statRevoked').textContent = revoked;
                    document.getElementById('statExpired').textContent = expired;

                    const tbody = document.getElementById('keysBody');
                    if (keys.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#848e9c;padding:20px">No license keys yet. Create one above.</td></tr>';
                        return;
                    }
                    tbody.innerHTML = keys.map(k => {
                        let badge = '';
                        if (k.revoked) badge = '<span class="badge badge-revoked">Revoked</span>';
                        else if (new Date(k.expires_at) < now) badge = '<span class="badge badge-expired">Expired</span>';
                        else if (k.active) badge = '<span class="badge badge-active">Active</span>';
                        const planText = k.plan_days === 9999 ? 'Lifetime' : k.plan_days + 'd';
                        const created = new Date(k.created_at).toLocaleDateString();
                        const expires = new Date(k.expires_at).toLocaleDateString();
                        const activated = k.activated_at ? new Date(k.activated_at).toLocaleDateString() : '-';
                        const hwId = k.hw_id ? k.hw_id.substring(0, 12) + '...' : '-';
                        return `<tr>
                            <td class="key-cell" onclick="copyKey('${k.key}')" title="Click to copy">${k.key}</td>
                            <td>${badge}</td>
                            <td>${planText}</td>
                            <td>${created}</td>
                            <td>${expires}</td>
                            <td>${activated}</td>
                            <td style="font-family:monospace;font-size:10px">${hwId}</td>
                            <td>${k.note || '-'}</td>
                            <td>
                                ${!k.revoked ? `<button class="btn btn-warn btn-sm" onclick="revokeKey('${k.key}')">Revoke</button>` : ''}
                                <button class="btn btn-danger btn-sm" onclick="deleteKey('${k.key}')">Delete</button>
                            </td>
                        </tr>`;
                    }).join('');
                });
        }

        function copyKey(key) {
            navigator.clipboard.writeText(key).then(() => {
                showMsg('Key copied: ' + key, 'success');
            });
        }

        function createKey() {
            const planDays = parseInt(document.getElementById('planDays').value);
            const note = document.getElementById('noteField').value;
            fetch('/api/admin/keys/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ plan_days: planDays, note: note })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    const lic = data.license;
                    showMsg('✅ License created: ' + lic.key, 'success');
                    navigator.clipboard.writeText(lic.key).catch(()=>{});
                    document.getElementById('noteField').value = '';
                    loadKeys();
                } else {
                    showMsg('❌ ' + data.error, 'error');
                }
            });
        }

        function revokeKey(key) {
            if (!confirm('Revoke this license? The user will lose access.')) return;
            fetch('/api/admin/keys/revoke', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: key })
            })
            .then(r => r.json())
            .then(data => {
                showMsg(data.success ? '✅ ' + data.message : '❌ ' + data.error,
                       data.success ? 'success' : 'error');
                loadKeys();
            });
        }

        function deleteKey(key) {
            if (!confirm('PERMANENTLY delete this key? This cannot be undone.')) return;
            fetch('/api/admin/keys/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: key })
            })
            .then(r => r.json())
            .then(data => {
                showMsg(data.success ? '✅ ' + data.message : '❌ ' + data.error,
                       data.success ? 'success' : 'error');
                loadKeys();
            });
        }

        function extendKey() {
            const key = document.getElementById('extendKey').value.trim();
            const days = parseInt(document.getElementById('extendDays').value);
            if (!key || !days) {
                showMsg('Please enter both key and days', 'error');
                return;
            }
            fetch('/api/admin/keys/extend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: key, extra_days: days })
            })
            .then(r => r.json())
            .then(data => {
                showMsg(data.success ? '✅ Extended by ' + days + ' days' : '❌ ' + data.error,
                       data.success ? 'success' : 'error');
                if (data.success) {
                    document.getElementById('extendKey').value = '';
                    loadKeys();
                }
            });
        }
    </script>
</body>
</html>
